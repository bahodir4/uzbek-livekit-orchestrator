# Customer UI domain: voice.neurotech.uz. The API lives on a DIFFERENT domain (api-voice.backend.uz).
# The browser must still see one origin, so this server serves the UI and forwards /api/ to the API domain
# (server to server). The login cookie then belongs to the UI domain and works with SameSite=Strict.
#
#   1. DNS: A record for voice.neurotech.uz -> this server      2. sudo systemctl stop nginx && sudo certbot certonly --standalone -d voice.neurotech.uz
#   3. copy the UI build (in.voice-back-frontend: npm run build, folder dist/) to /var/www/neurotech-ui      4. sudo cp this file to /etc/nginx/conf.d/ && sudo nginx -t && sudo systemctl reload nginx

# Limits are applied HERE, where the real client IP is visible (the API server only sees this server's address).
limit_req_zone  $binary_remote_addr zone=ui_login:10m rate=5r/m;
limit_req_zone  $binary_remote_addr zone=ui_api:10m   rate=20r/s;
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name voice.neurotech.uz;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                        # nginx >= 1.25.1; on older versions use "listen 443 ssl http2;"
    server_name voice.neurotech.uz;

    ssl_certificate     /etc/letsencrypt/live/voice.neurotech.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/voice.neurotech.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "no-referrer" always;
    add_header Permissions-Policy        "microphone=(self), camera=(), geolocation=()" always;

    root /var/www/neurotech-ui;
    index index.html;

    # The API name is resolved per request (variable + resolver), so nginx still starts and reloads when DNS is briefly
    # unavailable; with a plain proxy_pass hostname it would refuse to start.
    resolver 1.1.1.1 8.8.8.8 valid=60s ipv6=off;

    location = /api/login {
        limit_req zone=ui_login burst=5 nodelay;
        set $api_upstream https://api-voice.backend.uz;
        proxy_pass $api_upstream;
        proxy_ssl_server_name on;
        proxy_set_header Host              api-voice.backend.uz;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /api/ {
        limit_req zone=ui_api burst=40 nodelay;
        set $api_upstream https://api-voice.backend.uz;
        proxy_pass $api_upstream;                    # no URI part: the original /api/... path is passed unchanged
        proxy_ssl_server_name on;                    # send the API domain in the TLS handshake (SNI)
        proxy_set_header Host              api-voice.backend.uz;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;      # the real client; nothing the browser sent is trusted
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout    180s;
        proxy_buffering       off;                   # the TTS preview streams audio
    }

    location /assets/      { try_files $uri =404; expires max; }
    location /integration/ { try_files $uri =404; expires -1; }
    location /             { try_files $uri $uri/ /index.html; expires -1; }
}
