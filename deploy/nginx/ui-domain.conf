# Customer UI domain: voice.neurotech.uz. The API lives on a different host name (api-voice.neurotech.uz).
# The browser must still see one origin, so this server serves the UI and forwards /api/ to the API domain
# (server to server). The login cookie then belongs to the UI domain and works with SameSite=Strict.
#
#   1. DNS: A record for voice.neurotech.uz -> this server      2. sudo systemctl stop nginx && sudo certbot certonly --standalone -d voice.neurotech.uz
#   3. start the UI container (in.voice-back-frontend: sudo docker compose up -d --build, listens on 8080)      4. sudo cp this file to /etc/nginx/conf.d/ && sudo nginx -t && sudo systemctl reload nginx

# Limits are applied HERE, where the real client IP is visible (the API server only sees this server's address).
limit_req_zone  $binary_remote_addr zone=ui_login:10m rate=5r/m;
limit_req_zone  $binary_remote_addr zone=ui_api:10m   rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name voice.neurotech.uz;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;            # works on nginx 1.24 (Ubuntu 24.04) and newer; 1.25.1+ only prints a deprecation notice
    listen [::]:443 ssl http2;
    server_name voice.neurotech.uz;

    ssl_certificate     /etc/letsencrypt/live/voice.neurotech.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/voice.neurotech.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    server_tokens off;
    limit_req_status 429;            # answer "too many requests" instead of 503 when a limit is hit
    client_max_body_size 10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "no-referrer" always;
    add_header Permissions-Policy        "microphone=(self), camera=(), geolocation=()" always;

    # The API name is resolved per request (variable + resolver), so nginx still starts and reloads when DNS is briefly
    # unavailable; with a plain proxy_pass hostname it would refuse to start.
    resolver 1.1.1.1 8.8.8.8 valid=60s ipv6=off;

    location = /api/login {
        limit_req zone=ui_login burst=5 nodelay;
        set $api_upstream https://api-voice.neurotech.uz;
        proxy_pass $api_upstream;
        proxy_ssl_server_name on;
        proxy_set_header Host              api-voice.neurotech.uz;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /api/ {
        limit_req zone=ui_api burst=40 nodelay;
        set $api_upstream https://api-voice.neurotech.uz;
        proxy_pass $api_upstream;                    # no URI part: the original /api/... path is passed unchanged
        proxy_ssl_server_name on;                    # send the API domain in the TLS handshake (SNI)
        proxy_set_header Host              api-voice.neurotech.uz;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;      # the real client; nothing the browser sent is trusted
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout    180s;
        proxy_buffering       off;                   # the TTS preview streams audio
    }

    # The UI itself runs in Docker (in.voice-back-frontend: docker compose up -d, PORT=127.0.0.1:8080 or 8080) and is
    # served from there; /api/ above is handled by this nginx, where the real client IP is known.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
