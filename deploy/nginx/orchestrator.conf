# Public reverse proxy for the orchestrator API on api-voice.backend.uz. The customer UI is on voice.neurotech.uz
# (ui-domain.conf), which forwards /api/ here. To serve the UI from this domain instead, use the last block's comment.
#
# Install on the server that runs `docker compose up -d` (the API listens on 127.0.0.1:8090 only):
#   1. the domain (api-voice.backend.uz) is already set; add your office IP to the commented 'allow' line of the admin block to reach /docs from there
#   2. FIRST issue the certificate (nginx must be stopped for this; do NOT install this file before it exists):
#        sudo systemctl stop nginx && sudo certbot certonly --standalone -d api-voice.backend.uz
#   3. THEN copy this file to /etc/nginx/conf.d/orchestrator.conf   (limit_req_zone lines must live in the http context, which conf.d is)
#   4. copy the UI build (npm run build in in.voice-back-frontend, folder dist/) to /var/www/neurotech-ui
#   5. sudo nginx -t && sudo systemctl reload nginx
# The login cookie is SameSite=Strict, so browsers never call this domain directly: they talk to voice.neurotech.uz and that
# server forwards /api/ here. Programs (curl, Postman) can call this domain directly with Basic auth.

limit_req_zone  $binary_remote_addr zone=orch_login:10m rate=5r/m;     # password guessing: 5 tries per minute per IP
limit_req_zone  $binary_remote_addr zone=orch_api:10m   rate=20r/s;
limit_req_status 429;

# Requests from the UI server arrive from ITS address. So that the limits below count real users, trust the client address
# that the UI server forwards: put the UI server's IP here and uncomment.
#set_real_ip_from  UI_SERVER_IP;
#real_ip_header    X-Forwarded-For;

upstream orchestrator_api {
    server 127.0.0.1:8090;           # when nginx runs in a container on the compose network use: server api:8090;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name api-voice.backend.uz;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;            # works on nginx 1.24 (Ubuntu 24.04) and newer; 1.25.1+ only prints a deprecation notice
    listen [::]:443 ssl http2;
    server_name api-voice.backend.uz;

    ssl_certificate     /etc/letsencrypt/live/api-voice.backend.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-voice.backend.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 10m;        # voice notes are limited to 8 MB by the API

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "no-referrer" always;
    add_header Permissions-Policy        "microphone=(self), camera=(), geolocation=()" always;   # calls need the microphone

    # ---- what every proxied request carries ----------------------------------------------------------
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout    180s;      # the TTS preview streams audio for as long as the synthesis takes
    proxy_buffering       off;       # audio must reach the browser while it is generated

    # ---- administrator pages: never public ------------------------------------------------------------
    location ~ ^/(docs|openapi\.json|admin/) {
        allow 127.0.0.1;
        # allow YOUR_OFFICE_IP;
        deny  all;
        proxy_pass http://orchestrator_api;
    }

    # ---- login: strict rate limit -----------------------------------------------------------------------
    location = /api/login {
        limit_req zone=orch_login burst=5 nodelay;
        proxy_pass http://orchestrator_api;
    }

    # ---- the rest of the API ----------------------------------------------------------------------------
    location /api/ {
        limit_req zone=orch_api burst=40 nodelay;
        proxy_pass http://orchestrator_api;
    }

    location = /health/live {
        access_log off;
        proxy_pass http://orchestrator_api;
    }

    # ---- everything else: no pages on the API domain ---------------------------------------------------------
    location / { return 404; }
    # To serve the customer UI from THIS domain instead (one domain for UI and API), replace the line above with:
    #   root /var/www/neurotech-ui; index index.html;
    #   location /assets/      { try_files $uri =404; expires max; }
    #   location /integration/ { try_files $uri =404; expires -1; }
    #   location /             { try_files $uri $uri/ /index.html; expires -1; }
}
