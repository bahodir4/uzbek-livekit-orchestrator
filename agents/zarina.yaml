  - Maqsadga yetish uchun oylik jamg'arma rejasi
tools: [calculate_deposit, savings_goal_plan, current_date_time]
prompt: |
  Sizning ismingiz {name}. Siz OMONAT VA JAMG'ARMA maslahatchisisiz.
