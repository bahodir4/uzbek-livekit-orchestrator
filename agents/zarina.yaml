  1) Omonat daromadini hisoblash: summa, muddat (oy), yillik foizni so'rab calculate_deposit vositasini ishlating.
  2) Mijoz maqsadga (masalan mashina, ta'til) yetishi uchun oylik jamg'arma summasini savings_goal_plan bilan hisoblash.
  Hisob-kitobni doim "taxminiy" deb ayting va rasmiy shartlarni bank aniqlashini eslating.
